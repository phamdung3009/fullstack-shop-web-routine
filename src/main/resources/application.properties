spring.application.name=fullstack-shop-web-routine
spring.datasource.url=jdbc:mysql://localhost:3306/shop_web_routine
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
#server.contextPath=/mainstay
# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# Logging
logging.level.root=info
logging.file.path=logs
logging.file.name=logs/mylog.log

# bat loggin hien thi SQL
spring.jpa.show-sql=true
# hien thi dinh dang SQL de doc hon
spring.jpa.properties.hibernate.format_sql=true
# Log chi tiet cac truy van SQL va tham so
logging.level.org.hibernate.SQL=debug
# hien thi gia tri tham so
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=trace

