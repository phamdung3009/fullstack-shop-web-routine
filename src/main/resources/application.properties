spring.application.name=fullstack-shop-web-routine
spring.datasource.url=jdbc:mysql://localhost:3306/shop_web_routine
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
#server.contextPath=/mainstay
# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# Logging
logging.level.root=info
logging.file.path=logs
logging.file.name=logs/mylog.log

# B?t logging SQL
spring.jpa.show-sql=true
# Hi?n th? ??nh d?ng SQL d? ??c h?n
spring.jpa.properties.hibernate.format_sql=true
# Log chi ti?t các truy v?n SQL và tham s?
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE